<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>YouTube 알람</title>
  <style>html,body,#player{margin:0;width:100%;height:100%;background:#111;color:white}body{min-width:200px;min-height:200px}</style>
</head>
<body>
  <div id="player"></div>
  <script>
    'use strict';
    const query = new URLSearchParams(location.search);
    const video = query.get('v');
    const session = query.get('session');
    let player = null, timer = null, stopped = false;
    function send(type, fields = {}) {
      if (!stopped && window.chrome?.webview) window.chrome.webview.postMessage({ session, type, ...fields });
    }
    function sample() {
      if (!player || stopped) return;
      try {
        send('progress', { state: player.getPlayerState(), position: player.getCurrentTime(), muted: player.isMuted(), volume: Math.round(player.getVolume()) });
      } catch (_) { send('error', { code: 0 }); }
    }
    function stopAlarmPlayer() {
      stopped = true;
      clearInterval(timer);
      if (player) { try { player.mute(); player.stopVideo(); player.destroy(); } catch (_) {} }
      player = null;
    }
    window.addEventListener('pagehide', stopAlarmPlayer);
    window.onYouTubeIframeAPIReady = function () {
      if (stopped) return;
      try {
        player = new YT.Player('player', {
          width: '100%', height: '100%', videoId: video,
          playerVars: { autoplay: 1, playsinline: 1, controls: 1, loop: 1, playlist: video, origin: location.origin },
          events: {
            onReady: event => {
              if (stopped) return;
              event.target.unMute(); event.target.setVolume(100); event.target.playVideo();
              timer = setInterval(sample, 500);
              sample();
            },
            onStateChange: sample,
            onError: event => send('error', { code: event.data }),
            onAutoplayBlocked: () => send('blocked')
          }
        });
      } catch (_) { send('error', { code: 0 }); }
    };
    if (!/^[A-Za-z0-9_-]{11}$/.test(video || '') || !/^[a-f0-9]{32}$/.test(session || '')) {
      send('error', { code: 2 });
    } else {
      const script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      script.onerror = () => send('error', { code: 0 });
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
